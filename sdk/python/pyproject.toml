[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-asset-v2"
version = "2.0.0"
description = "MCP Spatial Asset Profile v2 — Python SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "spatial", "3d", "point-cloud", "segmentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.0"]
dev = [
    "pytest>=7",
    "jsonschema>=4.0",
]

[project.scripts]
spatial-asset-v2 = "spatial_asset_v2.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spatial_asset_v2*"]
