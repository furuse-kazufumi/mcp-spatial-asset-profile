name: Bug report
description: Report a concrete bug in the spec, JSON Schema, examples, or one of the reference SDKs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Before opening, please check that an existing issue does not already cover the same bug.

        Reports are welcome in English, 日本語, or 简体中文.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the project is affected?
      options:
        - Specification (spec/*.md)
        - JSON Schema (spec/schema/)
        - Canonical example (spec/examples/)
        - Python SDK (sdk/python/)
        - TypeScript SDK (sdk/typescript/)
        - Tests (tests/)
        - Documentation (README, docs/)
        - CI / tooling (.github/)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spec / SDK version
      description: e.g. spec v2.0.0, Python SDK commit hash, TypeScript SDK version.
      placeholder: "spec v2.0.0 / sdk-python @ <commit>"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps, commands, or a minimal asset/JSON snippet that reproduces the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages, stack traces, or schema validator output if applicable.
      render: shell
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Traceability impact (if applicable)
      description: Does this bug affect `derived_from`, `workflow.target_asset_id`, or the multi-view segmentation workflow?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else useful — environment, related issues, screenshots, links.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
